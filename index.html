<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Кэт Нап — Начало</title>
<link rel="icon" href="data:,">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI',Arial,sans-serif; color:#eee; user-select:none; }
.hidden { display:none !important; }
#loader { position:fixed; inset:0; background:#0a0a0f; display:flex; align-items:center; justify-content:center; z-index:100; }
.loader-box { width:80%; max-width:380px; text-align:center; }
.loader-title { font-size:2.4rem; font-weight:800; letter-spacing:4px; color:#e33; text-shadow:0 0 18px #e338; }
.loader-sub { font-size:.9rem; color:#888; margin:6px 0 22px; letter-spacing:2px; }
.bar { width:100%; height:8px; background:#222; border-radius:6px; overflow:hidden; }
.bar > div { height:100%; width:0%; background:linear-gradient(90deg,#e33,#f77); transition:width .3s; }
#loadText { margin-top:10px; font-size:.8rem; color:#777; }
#menu { position:fixed; inset:0; background:radial-gradient(circle at 50% 30%, #1a1020, #05050a 70%); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:90; overflow:hidden; }
#menu::before { content:''; position:absolute; inset:0; background:url('https://www.transparenttextures.com/patterns/fog.png') repeat; opacity:0.15; animation: fogMove 20s linear infinite; pointer-events:none; }
@keyframes fogMove { 0% { background-position:0 0; } 100% { background-position:300px 300px; } }

/* --- ГЛАЗА --- */
#eyes { position:absolute; top:20%; display:flex; gap:40px; opacity:0; animation: eyesAppear 3s forwards, lookAround 8s infinite 3s; z-index:91; }
.eye { width:40px; height:40px; background:#fff; border-radius:50%; box-shadow:0 0 30px 10px rgba(255,255,255,0.6); position:relative; }
.eye::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:12px; height:12px; background:#000; border-radius:50%; }

@keyframes eyesAppear {
  0% { opacity:0; transform:scale(0.2) translateY(20px); }
  100% { opacity:1; transform:scale(1) translateY(0); }
}
@keyframes lookAround {
  0%, 100% { transform:translateX(0); }
  25% { transform:translateX(-15px); }
  75% { transform:translateX(15px); }
}
.menu-title { font-size:3rem; font-weight:900; letter-spacing:6px; color:#e33; text-shadow:0 0 25px #e336; }
.menu-sub { font-size:.85rem; color:#888; margin:6px 0 36px; letter-spacing:3px; }
.menu-foot { position:absolute; bottom:16px; font-size:.7rem; color:#555; }
.btn { width:80%; max-width:320px; padding:14px; margin:7px 0; font-size:1rem; font-weight:600; color:#eee; background:#1c1c26; border:1px solid #333; border-radius:10px; cursor:pointer; transition:.15s; }
.btn:hover { background:#2a2a3a; border-color:#e33; }
.btn:active { transform:scale(.97); }
#settings { position:fixed; inset:0; background:#0c0c14; z-index:95; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
.settings-title { font-size:1.6rem; font-weight:800; margin-bottom:26px; color:#e33; }
.row { width:100%; max-width:340px; display:flex; align-items:center; justify-content:space-between; margin:12px 0; font-size:.9rem; color:#bbb; }
.row select, .row input[type=range] { width:150px; accent-color:#e33; }
.row select { background:#1c1c26; color:#eee; border:1px solid #333; border-radius:8px; padding:8px; }
#settings .btn { margin-top:26px; }
#game { position:fixed; inset:0; background:#000; z-index:50; }
#scene { width:100%; height:100%; display:block; }
#hint { position:absolute; bottom:22%; left:50%; transform:translateX(-50%); background:#000a; padding:8px 16px; border-radius:8px; font-size:.85rem; border:1px solid #e335; color:#fff; pointer-events:none; }
#mobile { position:absolute; inset:0; pointer-events:none; }
#joyZone { position:absolute; bottom:30px; left:30px; width:120px; height:120px; border-radius:50%; background:#ffffff10; border:2px solid #ffffff25; pointer-events:auto; touch-action:none; }
#joyKnob { position:absolute; top:50%; left:50%; width:52px; height:52px; margin:-26px 0 0 -26px; border-radius:50%; background:#ffffff30; border:2px solid #ffffff50; }
#btnAction { position:absolute; bottom:60px; right:36px; width:74px; height:74px; border-radius:50%; background:#e332; border:2px solid #e35; color:#fff; font-size:1.8rem; font-weight:800; display:flex; align-items:center; justify-content:center; pointer-events:auto; touch-action:none; }
#btnAction:active { background:#e336; }
#btnPause { position:absolute; top:16px; right:16px; width:44px; height:44px; border-radius:10px; background:#0008; border:1px solid #fff3; color:#fff; font-size:1rem; display:flex; align-items:center; justify-content:center; pointer-events:auto; }
#dialog { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent,#000d 25%); padding:60px 24px 28px; font-size:1.05rem; line-height:1.5; color:#fff; }
#dialogText { max-width:700px; margin:0 auto; }
#dialogNext { text-align:center; margin-top:14px; font-size:1.3rem; color:#e33; animation:blink 1s infinite; cursor:pointer; }
@keyframes blink { 50% { opacity:.2; } }
#levelLoad { position:absolute; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:60; }
#levelLoad .bar { display:none; }
#levelLoadText { font-size:1.4rem; color:#fff; text-align:center; padding:0 20px; letter-spacing:1px; line-height:1.5; text-shadow:0 0 10px #000; }
@media (max-width:500px) {
  .menu-title { font-size:2.2rem; }
  #joyZone { width:100px; height:100px; left:20px; bottom:24px; }
  #btnAction { width:64px; height:64px; right:28px; bottom:50px; font-size:1.5rem; }
}
</style>
</head>
<body>
<div id="loader">
  <div class="loader-box">
    <div class="loader-title">КЭТ НАП</div>
    <div class="loader-sub">Глава 1 — НАЧАЛО</div>
    <div class="bar"><div id="barFill"></div></div>
    <div id="loadText">Загрузка...</div>
  </div>
</div>
<div id="menu">
  <!-- ГЛАЗА В ТУМАНЕ -->
  <div id="eyes">
    <div class="eye"></div>
    <div class="eye"></div>
  </div>

  <div class="menu-title">КЭТ НАП</div>
  <div class="menu-sub">Poppy Playtime: Night Shift</div>
  <button class="btn" id="btnStart">▶ Глава 1 — НАЧАЛО</button>
  <button class="btn" id="btnSettings">⚙ Настройки</button>
  <div class="menu-foot">v0.1 • мобильная версия</div>
</div>
<div id="settings" class="hidden">
  <div class="settings-title">Настройки</div>
  <label class="row">Качество графики
    <select id="setQuality">
      <option value="low">Низкое (телефон)</option>
      <option value="medium" selected>Среднее</option>
      <option value="high">Высокое</option>
    </select>
  </label>
  <label class="row">Тени <input type="checkbox" id="setShadows" checked></label>
  <label class="row">Разрешение <input type="range" id="setRes" min="50" max="100" value="75"></label>
  <label class="row">Громкость <input type="range" id="setVol" min="0" max="100" value="70"></label>
  <button class="btn" id="btnBack">← Назад</button>
</div>
<div id="game" class="hidden">
  <canvas id="scene"></canvas>
  <div id="hint" class="hidden">Нажми E / кнопку</div>
  <div id="mobile" class="hidden">
    <div id="joyZone"><div id="joyKnob"></div></div>
    <div id="btnAction">!</div>
    <div id="btnPause">❚❚</div>
  </div>
  <div id="dialog" class="hidden">
    <div id="dialogText"></div>
    <div id="dialogNext">▶</div>
  </div>
  <div id="levelLoad" class="hidden">
    <div class="bar"><div id="levelBarFill"></div></div>
    <div id="levelLoadText">Загрузка...</div>
  </div>
</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
  // --- ЧАСТЬ 2: ДВИЖОК И ИГРОК ---
window.Game = {
  renderer: null, scene: null, camera: null, clock: null, running: false, paused: false,
  isMobile: /Android|iPhone|iPad|iPod/i.test(navigator.userAgent),
  settings: { quality: 'medium', shadows: true, resolution: 75, volume: 70 },
  input: { forward: 0, right: 0, action: false },
  player: null, currentLevel: null, levels: {}, THREE: null
};
window.Game.THREE = window.THREE;

Game.createRenderer = function() {
  const canvas = document.getElementById('scene');
  const renderer = new Game.THREE.WebGLRenderer({ canvas: canvas, antialias: Game.settings.quality !== 'low', powerPreference: 'high-performance' });
  Game.applyQuality(renderer);
  Game.renderer = renderer;
};

Game.applyQuality = function(renderer) {
  const q = Game.settings.quality;
  const dpr = Math.min(window.devicePixelRatio || 1, q === 'low' ? 1 : q === 'medium' ? 1.5 : 2);
  renderer.setPixelRatio(dpr * (Game.settings.resolution / 100));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = Game.settings.shadows && q !== 'low';
  renderer.shadowMap.type = Game.THREE.PCFSoftShadowMap;
  renderer.toneMapping = Game.THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = q === 'low' ? 0.9 : 1.0;
};

Game.createScene = function() {
  const scene = new Game.THREE.Scene();
  scene.background = new Game.THREE.Color(0x05050a);
  scene.fog = new Game.THREE.Fog(0x05050a, 20, 80);
  Game.scene = scene;
  const camera = new Game.THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 1.7, 5);
  Game.camera = camera;
};

Game.addLights = function(scene, opts) {
  opts = opts || {};
  const amb = new Game.THREE.AmbientLight(0x404060, opts.ambient || 0.6);
  scene.add(amb);
  const hemi = new Game.THREE.HemisphereLight(0x8899ff, 0x221100, opts.hemi || 0.4);
  scene.add(hemi);
  const dir = new Game.THREE.DirectionalLight(0xffeedd, opts.dir || 0.8);
  dir.position.set(5, 12, 6);
  if (Game.settings.shadows) {
    dir.castShadow = true;
    dir.shadow.mapSize.set(1024, 1024);
    dir.shadow.camera.near = 1;
    dir.shadow.camera.far = 50;
    dir.shadow.camera.left = -20;
    dir.shadow.camera.right = 20;
    dir.shadow.camera.top = 20;
    dir.shadow.camera.bottom = -20;
  }
  scene.add(dir);
};

Game.registerLevel = function(name, levelObj) { Game.levels[name] = levelObj; };

Game.loadLevel = function(name) {
  if (Game.currentLevel && Game.currentLevel.dispose) {
    try { Game.currentLevel.dispose(); } catch (e) { console.warn(e); }
  }
  Game.scene.clear();
  Game.scene.background = new Game.THREE.Color(0x05050a);
  Game.scene.fog = new Game.THREE.Fog(0x05050a, 20, 80);
  Game.addLights(Game.scene, { ambient: 0.5, hemi: 0.35, dir: 0.7 });
  Game.input.forward = Game.input.right = 0;

  const level = Game.levels[name];
  if (!level) { console.error('Уровень не найден:', name); return; }

  Game.showLevelLoad(true);
  document.getElementById('levelLoadText').textContent = 'Загрузка локации...';
  
  setTimeout(function() {
    level.init(Game.scene, Game.camera, function(p) { Game.setLevelProgress(p * 100); });
    document.getElementById('levelLoadText').textContent = 'Загрузка завершена...';
    setTimeout(function() {
      Game.showLevelLoad(false);
      Game.currentLevel = level;
    }, 1000);
  }, 500);
};

Game.showLevelLoad = function(show) {
  const el = document.getElementById('levelLoad');
  if (!el) return;
  if (show) el.classList.remove('hidden'); else el.classList.add('hidden');
};

Game.setLevelProgress = function(p) {};

Game.loop = function() {
  if (!Game.running) return;
  requestAnimationFrame(Game.loop);
  const dt = Math.min(Game.clock.getDelta(), 0.1);
  if (!Game.paused && Game.currentLevel && Game.currentLevel.update) Game.currentLevel.update(dt, Game);
  if (!Game.paused && Game.player && Game.player.update) Game.player.update(dt, Game);
  if (Game.renderer && Game.scene && Game.camera) Game.renderer.render(Game.scene, Game.camera);
};

Game.setupKeyboard = function() {
  const map = { KeyW: 'forward+', KeyS: 'forward-', KeyA: 'right-', KeyD: 'right+', ArrowUp: 'forward+', ArrowDown: 'forward-', ArrowLeft: 'right-', ArrowRight: 'right+' };
  window.addEventListener('keydown', function(e) {
    if (map[e.code]) { e.preventDefault(); Game.applyMove(map[e.code], true); }
    if (e.code === 'KeyE' || e.code === 'Space') Game.input.action = true;
    if (e.code === 'Escape') Game.togglePause();
  });
  window.addEventListener('keyup', function(e) {
    if (map[e.code]) Game.applyMove(map[e.code], false);
    if (e.code === 'KeyE' || e.code === 'Space') Game.input.action = false;
  });
};

Game.applyMove = function(dir, on) {
  const val = on ? 1 : 0;
  if (dir === 'forward+') Game.input.forward = val;
  if (dir === 'forward-') Game.input.forward = val ? -1 : 0;
  if (dir === 'right+') Game.input.right = val;
  if (dir === 'right-') Game.input.right = val ? -1 : 0;
};

Game.setupMobileControls = function() {
  if (!Game.isMobile) return;
  const mob = document.getElementById('mobile');
  if (mob) mob.classList.remove('hidden');
  const zone = document.getElementById('joyZone');
  const knob = document.getElementById('joyKnob');
  if (!zone || !knob) return;
  let active = false, cx = 0, cy = 0;
  const maxDist = 40;
  zone.addEventListener('touchstart', function(e) {
    const t = e.changedTouches[0];
    const r = zone.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    active = true; moveKnob(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });
  zone.addEventListener('touchmove', function(e) {
    if (!active) return;
    const t = e.changedTouches[0];
    moveKnob(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });
  zone.addEventListener('touchend', function() {
    active = false; knob.style.transform = 'translate(0,0)';
    Game.input.forward = 0; Game.input.right = 0;
  });
  function moveKnob(px, py) {
    let dx = px - cx, dy = py - cy;
    const len = Math.hypot(dx, dy);
    if (len > maxDist) { dx = dx / len * maxDist; dy = dy / len * maxDist; }
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
    Game.input.right = dx / maxDist;
    Game.input.forward = -dy / maxDist;
  }
  const btnA = document.getElementById('btnAction');
  if (btnA) {
    btnA.addEventListener('touchstart', function(e) { Game.input.action = true; e.preventDefault(); }, { passive: false });
    btnA.addEventListener('touchend', function() { Game.input.action = false; });
  }
  const btnP = document.getElementById('btnPause');
  if (btnP) btnP.addEventListener('click', Game.togglePause);
};

Game.togglePause = function() {
  if (!Game.running) return;
  Game.paused = !Game.paused;
  const p = document.getElementById('btnPause');
  if (p) p.textContent = Game.paused ? '▶' : '❚❚';
  Game.showHint(Game.paused ? 'Пауза' : null);
};

Game.showHint = function(text) {
  const el = document.getElementById('hint');
  if (!el) return;
  if (text) { el.textContent = text; el.classList.remove('hidden'); }
  else el.classList.add('hidden');
};

Game.showDialog = function(text, onNext) {
  const box = document.getElementById('dialog');
  const txt = document.getElementById('dialogText');
  const nxt = document.getElementById('dialogNext');
  if (!box || !txt || !nxt) return;
  box.classList.remove('hidden');
  txt.textContent = '';
  let i = 0;
  const timer = setInterval(function() {
    txt.textContent += text[i++] || '';
    if (i >= text.length) clearInterval(timer);
  }, 22);
  const handler = function() {
    nxt.removeEventListener('click', handler);
    box.classList.add('hidden');
    if (onNext) onNext();
  };
  nxt.addEventListener('click', handler);
};

Game.startGame = function(firstLevel) {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  if (!Game.clock) Game.clock = new Game.THREE.Clock();
  if (!Game.renderer) Game.createRenderer();
  Game.createScene();
  Game.setupKeyboard();
  Game.setupMobileControls();
  window.removeEventListener('resize', Game.onResize);
  window.addEventListener('resize', Game.onResize);
  Game.running = true;
  Game.paused = false;
  Game.clock.start();
  Game.loop();
  Game.loadLevel(firstLevel || 'level1_bank');
};

Game.onResize = function() {
  if (!Game.renderer || !Game.camera) return;
  Game.camera.aspect = window.innerWidth / window.innerHeight;
  Game.camera.updateProjectionMatrix();
  Game.applyQuality(Game.renderer);
};

Game.applySettingsFromUI = function() {
  Game.settings.quality = document.getElementById('setQuality').value;
  Game.settings.shadows = document.getElementById('setShadows').checked;
  Game.settings.resolution = +document.getElementById('setRes').value;
  Game.settings.volume = +document.getElementById('setVol').value;
  if (Game.renderer) Game.applyQuality(Game.renderer);
};

// --- ИГРОК ---
window.Player = {};

Player.create = function(scene, camera, opts) {
  opts = opts || {};
  const THREE = Game.THREE;
  const p = {
    camera: camera, position: new THREE.Vector3(opts.x || 0, opts.y || 1.7, opts.z || 0),
    yaw: opts.yaw || 0, pitch: 0, speed: opts.speed || 3.2, sprint: false, height: 1.7,
    gravity: -18, velocityY: 0, grounded: true, radius: 0.35, colliders: [], interactables: [],
    nearest: null, enabled: true,
  };
  camera.position.copy(p.position);
  Player.setupLook(p);

  p.update = function(dt) {
    if (!p.enabled) return;
    const THREE = Game.THREE;
    const fwd = Game.input.forward;
    const right = Game.input.right;
    if (fwd || right) {
      const sin = Math.sin(p.yaw), cos = Math.cos(p.yaw);
      let dx = (-sin * fwd) + (cos * right);
      let dz = (-cos * fwd) + (-sin * right);
      const len = Math.hypot(dx, dz);
      if (len > 0) { dx /= len; dz /= len; }
      const sp = p.speed * (p.sprint ? 1.7 : 1);
      const nx = p.position.x + dx * sp * dt;
      const nz = p.position.z + dz * sp * dt;
      if (!Player.collide(p, nx, p.position.z)) p.position.x = nx;
      if (!Player.collide(p, p.position.x, nz)) p.position.z = nz;
      
      // Звук шагов
      p.stepTimer = (p.stepTimer || 0) + dt;
      if (p.stepTimer > 0.5) {
        p.stepTimer = 0;
        if (!p.stepAudio) { p.stepAudio = new Audio('step.mp3'); p.stepAudio.volume = 0.3; }
        p.stepAudio.currentTime = 0;
        p.stepAudio.play().catch(function(){});
      }
    }
    
    p.velocityY += p.gravity * dt;
    p.position.y += p.velocityY * dt;
    if (p.position.y < p.height) { p.position.y = p.height; p.velocityY = 0; p.grounded = true; }
    p.camera.position.copy(p.position);
    p.camera.rotation.set(p.pitch, p.yaw, 0, 'YXZ');
    Player.updateNearest(p);
    if (Game.input.action) {
      Game.input.action = false;
      if (p.nearest) {
        const obj = p.nearest;
        if (obj.userData.onInteract) obj.userData.onInteract(p);
      }
    }
  };

  p.addInteractable = function(mesh, label, onInteract) {
    mesh.userData.interact = true;
    mesh.userData.label = label;
    mesh.userData.onInteract = onInteract;
    p.interactables.push(mesh);
    const marker = Player.makeMarker();
    marker.position.copy(mesh.position).add(new THREE.Vector3(0, 1.2, 0));
    mesh.add(marker);
    mesh.userData.marker = marker;
    return mesh;
  };

  p.addCollider = function(box3) { p.colliders.push(box3); };
  p.teleport = function(x, y, z, yaw) {
    p.position.set(x, y !== undefined ? y : p.height, z !== undefined ? z : 0);
    if (yaw !== undefined) p.yaw = yaw;
    p.velocityY = 0;
  };
  Game.player = p;
  return p;
};

Player.setupLook = function(p) {
  const canvas = Game.renderer.domElement;
  canvas.addEventListener('click', function() {
    if (!Game.isMobile && !document.pointerLockElement) canvas.requestPointerLock && canvas.requestPointerLock();
  });
  document.addEventListener('pointerlockchange', function() { p.lockActive = !!document.pointerLockElement; });
  document.addEventListener('mousemove', function(e) {
    if (!p.lockActive || Game.isMobile) return;
    p.yaw -= e.movementX * 0.0025;
    p.pitch -= e.movementY * 0.0025;
    Player.clampPitch(p);
  });
  if (Game.isMobile) {
    let touching = false, lastX = 0, lastY = 0;
    canvas.addEventListener('touchstart', function(e) {
      const t = e.changedTouches[0];
      if (t.clientX > window.innerWidth * 0.4) { touching = true; lastX = t.clientX; lastY = t.clientY; }
    }, { passive: true });
    canvas.addEventListener('touchmove', function(e) {
      if (!touching) return;
      const t = e.changedTouches[0];
      p.yaw -= (t.clientX - lastX) * 0.006;
      p.pitch -= (t.clientY - lastY) * 0.006;
      lastX = t.clientX; lastY = t.clientY;
      Player.clampPitch(p);
    }, { passive: true });
    canvas.addEventListener('touchend', function() { touching = false; });
  }
};

Player.clampPitch = function(p) {
  const lim = Math.PI / 2 - 0.05;
  if (p.pitch > lim) p.pitch = lim;
  if (p.pitch < -lim) p.pitch = -lim;
};

Player.collide = function(p, x, z) {
  const THREE = Game.THREE;
  const min = new THREE.Vector3(x - p.radius, p.position.y - p.height + 0.1, z - p.radius);
  const max = new THREE.Vector3(x + p.radius, p.position.y + 0.1, z + p.radius);
  const testBox = new THREE.Box3(min, max);
  for (let i = 0; i < p.colliders.length; i++) {
    if (testBox.intersectsBox(p.colliders[i])) return true;
  }
  return false;
};

Player.updateNearest = function(p) {
  const THREE = Game.THREE;
  let best = null, bestDist = 2.4;
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(p.camera.quaternion);
  for (let i = 0; i < p.interactables.length; i++) {
    const obj = p.interactables[i];
    if (!obj.visible) continue;
    const wp = new THREE.Vector3();
    obj.getWorldPosition(wp);
    const dist = wp.distanceTo(p.position);
    if (dist < bestDist) {
      const toObj = wp.clone().sub(p.position).normalize();
      const dot = toObj.dot(forward);
      if (dot > 0.2 || dist < 1.2) { best = obj; bestDist = dist; }
    }
  }
  if (best !== p.nearest) {
    if (p.nearest && p.nearest.userData.marker) p.nearest.userData.marker.visible = true;
    p.nearest = best;
    if (best && best.userData.label) {
      Game.showHint(Game.isMobile ? 'Нажми «!»' : 'E — ' + best.userData.label);
    } else {
      Game.showHint(null);
    }
  }
};

Player.makeMarker = function() {
  const THREE = Game.THREE;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.beginPath();
  ctx.arc(64, 64, 56, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(220,40,40,0.9)';
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = '#fff';
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 92px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('!', 64, 68);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(0.5, 0.5, 0.5);
  sprite.renderOrder = 999;
  return sprite;
};

Player.addBoxCollider = function(player, mesh) {
  const THREE = Game.THREE;
  mesh.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(mesh);
  player.addCollider(box);
  return box;
};

Player.buildRoom = function(scene, w, d, h, matFloor, matWall) {
  const THREE = Game.THREE;
  const group = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, d), matFloor);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  group.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(w, d), matWall);
  ceil.rotation.x = Math.PI / 2;
  ceil.position.y = h;
  group.add(ceil);
  const makeWall = function(x, z, rotY, len) {
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(len, h), matWall);
    wall.position.set(x, h / 2, z);
    wall.rotation.y = rotY;
    wall.receiveShadow = true;
    group.add(wall);
    return wall;
  };
  makeWall(0, -d / 2, 0, w);
  makeWall(0, d / 2, Math.PI, w);
  makeWall(-w / 2, 0, Math.PI / 2, d);
  makeWall(w / 2, 0, -Math.PI / 2, d);
  scene.add(group);
  return group;
};

        if (m && m.visible) m.position.y = 1.2 + Math.sin(Date.now() * 0.003) * 0.1;
      });
    }
  },

  dispose: function() {
    if (this.group) {
      this.group.traverse(function(o) { 
        if (o.geometry) o.geometry.dispose(); 
        if (o.material) o.material.dispose && o.material.dispose(); 
      });
    }
  },

  addWallColliders: function(W, D, H) {
    const THREE = Game.THREE;
    const t = 0.3;
    const boxes = [
      { x: 0, z: -D/2 - t/2, w: W + 2*t, d: t },
      { x: 0, z: D/2 + t/2, w: W + 2*t, d: t },
      { x: -W/2 - t/2, z: 0, w: t, d: D + 2*t },
      { x: W/2 + t/2, z: 0, w: t, d: D + 2*t },
    ];
    const self = this;
    boxes.forEach(function(b) {
      const box = new THREE.Box3(new THREE.Vector3(b.x - b.w/2, 0, b.z - b.d/2), new THREE.Vector3(b.x + b.w/2, H, b.z + b.d/2));
      self.player.addCollider(box);
    });
  },

  updateMarkers: function() {
    const self = this;
    this.player.interactables.forEach(function(obj) {
      const m = obj.userData.marker;
      if (!m) return;
      const label = (obj.userData.label || '').toLowerCase();
      let show = false;
      if (label.indexOf('компьютер') !== -1) show = !self.tasks[0].done;
      if (label.indexOf('хранилище') !== -1) show = self.tasks[0].done && !self.tasks[1].done;
      if (label.indexOf('свет') !== -1) show = self.tasks[1].done && !self.tasks[2].done;
      if (label.indexOf('ключ') !== -1) show = self.tasks[2].done && !self.tasks[3].done;
      m.visible = show;
    });
  },

  nextTaskHint: function() {
    const next = this.tasks.find(function(t) { return !t.done; });
    if (next) Game.showHint('Задача: ' + next.label);
    else Game.showHint(null);
  },

  transitionToStreet: function() {
    Game.paused = true;
    Game.showDialog('Ты выходишь из банка. На улице тихо и темно...', function() {
      Game.registerLevel('level2_street', window.Level2Street);
      Game.loadLevel('level2_street');
    });
  }
};

    const kitColliders = [

      new THREE.Box3(new THREE.Vector3(9.3, 0, -0.5), new THREE.Vector3(9.5, 3, 4.5)),
      new THREE.Box3(new THREE.Vector3(4.5, 0, -0.7), new THREE.Vector3(9.5, 3, -0.5)),
      new THREE.Box3(new THREE.Vector3(4.5, 0, 4.3), new THREE.Vector3(9.5, 3, 4.5)),
    ];
    kitColliders.forEach(function(b) { self.player.addCollider(b); });

    const bedroom = Player.buildRoom(this.group, 5, 5, 3, matFloor, matWall);
    bedroom.position.set(-7, 0, 2);
    const bedColliders = [
      new THREE.Box3(new THREE.Vector3(-9.5, 0, -0.5), new THREE.Vector3(-9.3, 3, 4.5)),
      new THREE.Box3(new THREE.Vector3(-4.7, 0, -0.5), new THREE.Vector3(-4.5, 3, 4.5)),
      new THREE.Box3(new THREE.Vector3(-9.5, 0, -0.7), new THREE.Vector3(-4.5, 3, -0.5)),
      new THREE.Box3(new THREE.Vector3(-9.5, 0, 4.3), new THREE.Vector3(-4.5, 3, 4.5)),
    ];
    bedColliders.forEach(function(b) { self.player.addCollider(b); });

    const hallLight = new THREE.PointLight(0xffdd99, 0.9, 10, 2);
    hallLight.position.set(0, 2.7, -2);
    this.group.add(hallLight);
    const kitLight = new THREE.PointLight(0xffeedd, 0.7, 8, 2);
    kitLight.position.set(7, 2.7, 2);
    this.group.add(kitLight);
    const bedLight = new THREE.PointLight(0x8899ff, 0.4, 6, 2);
    bedLight.position.set(-7, 2.5, 2);
    this.group.add(bedLight);

    const doorMat = new THREE.MeshStandardMaterial({ color: 0x5a3d26 });
    
    const doorToKitchen = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.2, 0.1), doorMat);
    doorToKitchen.position.set(3.95, 1.1, -2);
    doorToKitchen.rotation.y = -Math.PI / 2;
    this.group.add(doorToKitchen);
    this.player.addInteractable(doorToKitchen, 'зайти на кухню', function() {
      if (window.doorAudio) { window.doorAudio.currentTime = 0; window.doorAudio.play().catch(function(){}); }
      else { window.doorAudio = new Audio('door_open.mp3'); window.doorAudio.play().catch(function(){}); }
      self.player.teleport(6.5, 1.7, 2, Math.PI);
    });

    const doorFromKitchen = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.2, 0.1), doorMat);
    doorFromKitchen.position.set(4.55, 1.1, 2);
    doorFromKitchen.rotation.y = Math.PI / 2;
    this.group.add(doorFromKitchen);
    this.player.addInteractable(doorFromKitchen, 'вернуться в зал', function() {
      if (window.doorAudio) { window.doorAudio.currentTime = 0; window.doorAudio.play().catch(function(){}); }
      else { window.doorAudio = new Audio('door_open.mp3'); window.doorAudio.play().catch(function(){}); }
      self.player.teleport(3.0, 1.7, -2, -Math.PI / 2);
    });

    const doorToBedroom = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.2, 0.1), doorMat);
    doorToBedroom.position.set(-3.95, 1.1, -2);
    doorToBedroom.rotation.y = Math.PI / 2;
    this.group.add(doorToBedroom);
    this.player.addInteractable(doorToBedroom, 'зайти в спальню', function() {
      if (window.doorAudio) { window.doorAudio.currentTime = 0; window.doorAudio.play().catch(function(){}); }
      else { window.doorAudio = new Audio('door_open.mp3'); window.doorAudio.play().catch(function(){}); }
      self.player.teleport(-6.5, 1.7, 2, Math.PI);
    });

    const doorFromBedroom = new THREE.Mesh(new THREE.BoxGeometry(1.0, 2.2, 0.1), doorMat);
    doorFromBedroom.position.set(-4.55, 1.1, 2);
    doorFromBedroom.rotation.y = -Math.PI / 2;
    this.group.add(doorFromBedroom);
    this.player.addInteractable(doorFromBedroom, 'вернуться в зал', function() {
      if (window.doorAudio) { window.doorAudio.currentTime = 0; window.doorAudio.play().catch(function(){}); }
      else { window.doorAudio = new Audio('door_open.mp3'); window.doorAudio.play().catch(function(){}); }
      self.player.teleport(-3.0, 1.7, -2, Math.PI / 2);
    });

    const table = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 1), new THREE.MeshStandardMaterial({ color: 0x5a3d26 }));
    table.position.set(0, 0.4, -3);
    this.group.add(table);
    Player.addBoxCollider(this.player, table);

    const radio = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.3, 0.25), new THREE.MeshStandardMaterial({ color: 0x333333 }));
    radio.position.set(0, 1.0, -3.2);
    this.group.add(radio);

    const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.2, 0.1, 16), new THREE.MeshStandardMaterial({ color: 0xdddddd }));
    bowl.position.set(0, 0.9, -3);
    bowl.visible = false;
    this.group.add(bowl);

    const fridge = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 0.8), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.3 }));
    fridge.position.set(8, 1, 2);
    this.group.add(fridge);
    Player.addBoxCollider(this.player, fridge);

    const bed = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 2), new THREE.MeshStandardMaterial({ color: 0x445577 }));
    bed.position.set(-7, 0.25, 3);
    this.group.add(bed);
    Player.addBoxCollider(this.player, bed);

    this.player.teleport(0, 1.7, 1.0, Math.PI);

    this.player.addInteractable(fridge, 'достать доширак', function() {
      if (self.stageData.ramen) return;
      self.stageData.ramen = true;
      bowl.visible = true;
      fridge.userData.marker.visible = false;
      radio.userData.marker.visible = true;
      Game.showDialog('Доширак готов. Возвращайся в зал и включи радио.');
    });

    this.player.addInteractable(radio, 'включить радио', function() {
      if (!self.stageData.ramen) return;
      radio.userData.marker.visible = false;
      self.playRadioScene(bed);
    });

    this.player.addInteractable(bed, 'лечь спать', function() {
      if (!self.stageData.radioDone) { Game.showDialog('Сначала поешь и послушай новости.'); return; }
      bed.userData.marker.visible = false;
      Game.showDialog('Ты ложишься на кровать и засыпаешь...', function() {
        setTimeout(function() { self.loadMorning(); }, 800);
      });
    });

    radio.userData.marker.visible = false;
    bed.userData.marker.visible = false;
    Game.showDialog('Ты дома. Зайди на кухню через дверь справа.');
  },

  playRadioScene: function(bed) {
    const self = this;
    this.stageData.radioDone = true;
    
    const radioAudio = new Audio('radio.mp3');
    radioAudio.volume = 0.8;
    radioAudio.play().catch(function(){});
    
    const lines = [
      'Ты ешь доширак и слушаешь радио...',
      'РАДИО: «СРОЧНЫЕ НОВОСТИ! Недалеко от города на заводе игрушек случилась мистика!»',
      'РАДИО: «Все работники за 1 час пропали. На полу кровь и странные следы...»',
      'РАДИО: «Ни за что не выходите из дома, пока не прояснятся обстоятельства... (помехи)»'
    ];
    
    let i = 0;
    const next = function() {
      if (i >= lines.length) {
        radioAudio.pause();
        const thoughtsAudio = new Audio('thoughts.mp3');
        thoughtsAudio.volume = 0.8;
        thoughtsAudio.play().catch(function(){});
        
        Game.showDialog('Ты знаешь, что завтра у тебя выходной. Ты решаешь отправиться на завод игрушек.', function() {
          bed.userData.marker.visible = true;
          Game.showHint('Иди в спальню и ложись спать.');
        });
        return;
      }
      Game.showDialog(lines[i++], next);
    };
    next();
  },

  loadMorning: function() {
    const THREE = Game.THREE;
    const self = this;
    this.clearGroup();
    this.stage = 'morning';
    const matFloor = new THREE.MeshStandardMaterial({ color: 0x6a5540, roughness: 0.9 });
    const matWall  = new THREE.MeshStandardMaterial({ color: 0xb0a080, roughness: 1 });
    Player.buildRoom(this.group, 6, 6, 3, matFloor, matWall);
    const l = new THREE.PointLight(0xaaccff, 1.0, 12, 2);
    l.position.set(0, 2.7, 0);
    this.group.add(l);

    const shelf = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 0.4), new THREE.MeshStandardMaterial({ color: 0x5a3d26 }));
    shelf.position.set(-2, 1.4, -2.7);
    this.group.add(shelf);
    const keys = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.06, 0.12), new THREE.MeshStandardMaterial({ color: 0xddaa33, metalness: 0.8, roughness: 0.3 }));
    keys.position.set(-2, 1.5, -2.7);
    this.group.add(keys);

    const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.1), new THREE.MeshStandardMaterial({ color: 0x5a3d26 }));
    door.position.set(2, 1.1, 2.9);
    this.group.add(door);

    this.player.teleport(0, 1.7, 2, Math.PI);

    this.player.addInteractable(keys, 'взять ключи от машины', function() {
      self.stageData.hasKeys = true;
      keys.visible = false;
      keys.userData.marker.visible = false;
      door.userData.marker.visible = true;
      Game.showDialog('Ключи в кармане. Пора выходить.');
    });

    this.player.addInteractable(door, 'выйти из квартиры', function() {
      if (!self.stageData.hasKeys) { Game.showDialog('Сначала возьми ключи.'); return; }
      self.stage = 'drive';
      
      if (window.doorAudio) { window.doorAudio.currentTime = 0; window.doorAudio.play().catch(function(){}); }
      else { window.doorAudio = new Audio('door_open.mp3'); window.doorAudio.play().catch(function(){}); }
      
      const loadScreen = document.getElementById('levelLoad');
      const loadText = document.getElementById('levelLoadText');
      loadScreen.classList.remove('hidden');
      loadText.textContent = 'Ты едешь по лесу... Вдруг машина наезжает на капкан!';
      
      setTimeout(function() {
        Game.registerLevel('level3_forest', window.Level3Forest);
        Game.loadLevel('level3_forest');
        loadScreen.classList.add('hidden');
      }, 4000);
    });

    door.userData.marker.visible = false;
    Game.showDialog('Утро. Возьми ключи с полки (знак «!»).');
    Game.showHint('Возьми ключи от машины.');
  }
};
Game.registerLevel('level2_street', window.Level2Street);

// --- КОНЕЦ ЧАСТИ 4 ---
  // --- ЧАСТЬ 5: УРОВЕНЬ 3 (ЛЕС И ИЗБУШКА) ---
window.Level3Forest = {
  player: null, group: null, stage: '', stageData: {},

  init: function(scene, camera, onProgress) {
    const THREE = Game.THREE;
    this.group = new THREE.Group();
    scene.add(this.group);
    this.player = Player.create(scene, camera, { x: 0, y: 1.7, z: 10, yaw: Math.PI });
    this.player.speed = 2.6;
    this.stage = 'crash';
    this.stageData = {};

    if (onProgress) onProgress(0.1);
    this.buildForest();
    if (onProgress) onProgress(0.5);
    this.buildCarWreck();
    if (onProgress) onProgress(0.7);
    this.buildPath();
    if (onProgress) onProgress(0.85);
    this.buildHut();
    if (onProgress) onProgress(1);

    Game.showDialog('Машина наехала на капкан. Придётся идти пешком.', function() {
      Game.showHint('Найди тропинку сквозь деревья (знак «!»).');
    });
  },

  update: function(dt) {
    if (this.player) this.player.update(dt);
    if (this.stage === 'hut') {
      const t = Date.now() * 0.001;
      const lamp = this.group.getObjectByName('hutLamp');
      if (lamp) lamp.intensity = 0.7 + Math.sin(t * 2) * 0.15;
    }
  },

  dispose: function() {
    if (this.group) {
      this.group.traverse(function(o) {
        if (o.geometry) o.geometry.dispose();
        if (o.material) o.material.dispose && o.material.dispose();
      });
    }
  },

  buildForest: function() {
    const THREE = Game.THREE;
    const textureLoader = new THREE.TextureLoader();
    const dirtTex = textureLoader.load('dirt.jpg');
    dirtTex.wrapS = dirtTex.wrapT = THREE.RepeatWrapping;
    dirtTex.repeat.set(10, 10);
    
    const matGround = new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 1 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), matGround);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    this.group.add(ground);

    Game.scene.fog = new THREE.Fog(0x0a1410, 8, 50);
    Game.scene.background = new THREE.Color(0x0a1410);

    const matTrunk = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 1 });
    const matLeaf  = new THREE.MeshStandardMaterial({ color: 0x1e3a1e, roughness: 1 });
    
    for (let i = 0; i < 60; i++) {
      const x = (Math.random() - 0.5) * 90;
      const z = (Math.random() - 0.5) * 90;
      if (Math.abs(x) < 3 && z < 15 && z > -30) continue;
      if (Math.hypot(x, z - 10) < 6) continue;
      
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 4), matTrunk);
      trunk.position.set(x, 2, z);
      trunk.castShadow = true;
      this.group.add(trunk);
      
      const crown = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 6), matLeaf);
      crown.position.set(x, 5, z);
      crown.castShadow = true;
      this.group.add(crown);
      
      const box = new THREE.Box3(new THREE.Vector3(x - 0.3, 0, z - 0.3), new THREE.Vector3(x + 0.3, 4, z + 0.3));
      this.player.addCollider(box);
    }

    const moon = new THREE.DirectionalLight(0x8899cc, 0.5);
    moon.position.set(-10, 20, -10);
    this.group.add(moon);
    const amb = new THREE.AmbientLight(0x223344, 0.4);
    this.group.add(amb);
  },

  buildCarWreck: function() {
    const THREE = Game.THREE;
    const self = this;
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.7, 4), new THREE.MeshStandardMaterial({ color: 0x663333, metalness: 0.3, roughness: 0.7 }));
    body.position.y = 0.6;
    body.rotation.z = 0.15;
    body.rotation.x = -0.1;
    body.castShadow = true;
    g.add(body);
    
    const trap = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.05, 6, 12), new THREE.MeshStandardMaterial({ color: 0x777777, metalness: 0.9, roughness: 0.3 }));
    trap.rotation.x = Math.PI / 2;
    trap.position.set(-0.8, 0.1, 1.5);
    g.add(trap);
    g.position.set(0, 0, 10);
    this.group.add(g);
    Player.addBoxCollider(this.player, body);

    const trigger = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ visible: false }));
    trigger.position.set(0, 1, 2);
    this.group.add(trigger);
    
    this.player.addInteractable(trigger, 'пойти по тропинке', function() {
      if (self.stage !== 'crash') return;
      self.stage = 'path';
      trigger.userData.marker.visible = false;
      Game.showDialog('Ты видишь тропинку сквозь деревья и идёшь по ней.', function() {
        self.player.teleport(0, 1.7, -5, Math.PI);
        Game.showHint('Иди по тропинке к избушке.');
        const hutDoor = self.group.getObjectByName('hutDoor');
        if (hutDoor) hutDoor.userData.marker.visible = true;
      });
    });
  },

  buildPath: function() {
    const THREE = Game.THREE;
    const matPath = new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 1 });
    for (let z = 2; z > -28; z -= 2) {
      const tile = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.6), matPath);
      tile.rotation.x = -Math.PI / 2;
      tile.position.set(0, 0.02, z);
      tile.receiveShadow = true;
      this.group.add(tile);
    }
  },

  buildHut: function() {
    const THREE = Game.THREE;
    const self = this;
    const hut = new THREE.Group();
    hut.position.set(0, 0, -32);

    const textureLoader = new THREE.TextureLoader();
    const logTex = textureLoader.load('wood_log.jpg');
    logTex.wrapS = logTex.wrapT = THREE.RepeatWrapping;
    logTex.repeat.set(2, 2);

    const matLog = new THREE.MeshStandardMaterial({ map: logTex, roughness: 0.95 });
    const walls = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 5), matLog);
    walls.position.y = 2;
    walls.castShadow = walls.receiveShadow = true;
    hut.add(walls);
    Player.addBoxCollider(this.player, walls);

    const roof = new THREE.Mesh(new THREE.ConeGeometry(4.5, 2.5, 4), new THREE.MeshStandardMaterial({ color: 0x2a1a10, roughness: 1 }));
    roof.position.y = 5.2;
    roof.rotation.y = Math.PI / 4;
    hut.add(roof);

    const door = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2.2, 0.12), new THREE.MeshStandardMaterial({ color: 0x2a1a10 }));
    door.position.set(0, 1.1, 2.55);
    door.name = 'hutDoor';
    hut.add(door);

    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), new THREE.MeshStandardMaterial({ color: 0xffcc66, emissive: 0xffaa33, emissiveIntensity: 0.9 }));
    win.position.set(1.8, 2, 2.56);
    hut.add(win);

    const lamp = new THREE.PointLight(0xffaa55, 0.8, 10, 2);
    lamp.position.set(0, 2.8, 3);
    lamp.name = 'hutLamp';
    hut.add(lamp);

    this.group.add(hut);

    this.player.addInteractable(door, 'постучать в дверь', function() {
      if (self.stage === 'end') return;
      if (self.stage !== 'path' && self.stage !== 'hut') return;
      self.stage = 'hut';
      door.userData.marker.visible = false;
      
      if (window.doorAudio) { window.doorAudio.currentTime = 0; window.doorAudio.play().catch(function(){}); }
      else { window.doorAudio = new Audio('door_open.mp3'); window.doorAudio.play().catch(function(){}); }
      
      self.startEnding();
    });
    door.userData.marker.visible = false;
  },

  startEnding: function() {
    this.stage = 'end';
    Game.showHint(null);
    const lines = [
      'Ты стучишь в дверь... Тишина.',
      'Слышны медленные шаги за дверью.',
      'Дверь медленно открывается...',
    ];
    let i = 0;
    const self = this;
    const next = function() {
      if (i >= lines.length) {
        self.fadeToBlack(function() {
          Game.showDialog('КОНЕЦ ГЛАВЫ 1 — «НАЧАЛО»', function() {
            Game.running = false;
            document.getElementById('game').classList.add('hidden');
            document.getElementById('menu').classList.remove('hidden');
            Game.currentLevel = null;
            Game.player = null;
          });
        });
      } else {
        Game.showDialog(lines[i++], next);
      }
    };
    next();
  },

  fadeToBlack: function(cb) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:#000;opacity:0;transition:opacity 2s;z-index:999;';
    document.body.appendChild(overlay);
    requestAnimationFrame(function() { overlay.style.opacity = '1'; });
    setTimeout(function() {
      cb();
      setTimeout(function() { overlay.remove(); }, 500);
    }, 2200);
  }
};

Game.registerLevel('level3_forest', window.Level3Forest);

// --- ФИНАЛЬНЫЙ ЗАПУСК ---
window.addEventListener('DOMContentLoaded', function() {
  const loader = document.getElementById('loader');
  if (loader) loader.style.display = 'none';

  const btnStart = document.getElementById('btnStart');
  if (btnStart) {
    btnStart.addEventListener('click', function() {
      Game.startGame('level1_bank');
    });
  }

  const btnSettings = document.getElementById('btnSettings');
  if (btnSettings) {
    btnSettings.addEventListener('click', function() {
      document.getElementById('menu').classList.add('hidden');
      document.getElementById('settings').classList.remove('hidden');
    });
  }

  const btnBack = document.getElementById('btnBack');
  if (btnBack) {
    btnBack.addEventListener('click', function() {
      Game.applySettingsFromUI();
      document.getElementById('settings').classList.add('hidden');
      document.getElementById('menu').classList.remove('hidden');
    });
  }
});
